<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Aegis Maintenance Copilot - Intelligent maintenance management system powered by AI. Manage tickets, machines, and maintenance operations efficiently." />
    <meta name="keywords" content="maintenance management, ticket system, machine monitoring, AI assistant, maintenance copilot" />
    <meta name="author" content="Aegis" />
    <meta name="robots" content="index, follow" />
    
    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://backend-ruddy-eta.vercel.app" />
    
    <!-- Preconnect to API server -->
    <link rel=\"preconnect\" href=\"https://backend-ruddy-eta.vercel.app\" crossorigin />\n    \n    <!-- Prefetch for better navigation (only after initial load) -->\n    <link rel=\"prefetch\" as=\"script\" href=\"/assets/vendor-charts\" />\n    <link rel=\"prefetch\" as=\"script\" href=\"/assets/vendor-markdown\" />
    \n    <!-- Preload critical fonts with display swap for better FCP -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    
    <!-- Performance optimization meta tags -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    
    <!-- Inline critical CSS for above-the-fold content -->
    <style>
      /* Critical CSS - prevents FOUC and improves LCP */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:currentColor}
      html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,sans-serif;font-display:swap}
      body{margin:0;line-height:inherit;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh;display:flex;flex-direction:column;will-change:auto}
      /* Loading state */
      .loading-spinner{display:inline-block;width:2rem;height:2rem;border:3px solid rgba(0,0,0,0.1);border-radius:50%;border-top-color:#3b82f6;animation:spin 0.6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Login/Register page critical styles */
      .auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(to bottom right,#f4f4f5,#71717a,#18181b)}
      /* Prevent layout shift */
      img,video{max-width:100%;height:auto}
      /* Optimized fade-in animation */
      @keyframes fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .animate-fade-in{animation:fade-in 0.3s ease-out}
    </style>
    
    <title>Maintenance Copilot</title>
    
    <!-- Mobile-first optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
